-size="13" lengthAdjust="spacing" textLength="170.5806" x="1394" y="194.2966">There is no single concrete</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="193.0005" x="1394" y="209.6072">`RaiImage` root class in code.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="189.2109" x="1394" y="224.9177">This view centers the package</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="168.6318" x="1394" y="240.2283">on image-aware file types,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="163.3379" x="1394" y="255.5388">derived path conventions,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="187.8843" x="1394" y="270.8494">and ImageMagick integration.</text></g><g class="entity" data-qualified-name="GMN39" data-source-line="165" id="ent0040"><path d="M1636.85,199.6983 L1636.85,255.6299 L1951.1435,255.6299 L1951.1435,209.6983 L1941.1435,199.6983 L1636.85,199.6983" fill="#FFF7D6" style="stroke:#D4B106;stroke-width:0.5;"/><path d="M1941.1435,199.6983 L1941.1435,209.6983 L1951.1435,209.6983 L1941.1435,199.6983" fill="#FFF7D6" style="stroke:#D4B106;stroke-width:1;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="266.957" x="1642.85" y="217.2666">Legacy image-processing facade retained.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="228.4775" x="1642.85" y="232.5772">Process execution is routed through</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="293.2935" x="1642.85" y="247.8877">ImageMagickCommand and OsLib CLI helpers.</text></g><!--link ImageFile to RaiFile--><g class="link" data-entity-1="ent0003" data-entity-2="ent0018" data-link-type="extension" data-so